  - {id: D2, libelle: "Parcours de consultation des commandes", critere_succes: "statut à jour depuis l'ERP"}
  - {id: D3, libelle: "Parcours de consultation des factures", critere_succes: "telechargement PDF opérationnel"}
  - {id: D4, libelle: "Parcours de commande sur catalogue", critere_succes: "commande arrivee complète dans l'ERP sans ressaisie"}
  - {id: D5, libelle: "Socle responsive", critere_succes: "tous les parcours passent les critères d'acceptation mobile"}
  - {id: D6, libelle: "Interface ERP", critere_succes: "aucune divergence sur un échantillon de contrôle"}
  - {id: D7, libelle: "Reprise des comptes clients", critere_succes: "100 % des comptes actifs migres et fonctionnels"}
