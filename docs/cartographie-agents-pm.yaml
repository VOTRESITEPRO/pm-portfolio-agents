# =============================================================================
# CARTOGRAPHIE DE L'Équipe D'AGENTS — GENERATION DU PORTFOLIO D'ARTEFACTS PM
# Livrable 1 du projet "PO-BA IA"
# =============================================================================
# Objet   : orchestration d'agents IA qui transforme une description de projet
#           en portfolio complet d'artefacts de gestion de projet, aligne sur
#           le Google Project Management Certificate (Cours 1 à 6).
# Statut  : Présentable — conception documentee, destinee à être commentee en
#           entretien. Aucun agent n'est exécute à ce stade.
# =============================================================================

meta:
  version: "1.1"
  historique:
    - version: "1.0"
      date: "2026-08-31"
      note: "conception initiale, 15 agents"
    - version: "1.1"
      date: "2026-08-31"
      note: >
        Corrections C1 à C6 issues de la tranche verticale de test
        (portfolio-demo/99-lecons-conception.md). Aucune modification du nombre
        ni du périmètre des agents : uniquement les portes qualité, les règles
        de cohérence et les catégories de valeur.
  date: "2026-08-31"
  remplace: "cartographieagents.md (orientation PO/BA fonctionnel — périmètre anterieur)"
  perimetre_actif: "PM classique + agile, aligne Google PM Cert C1-C6"
  perimetre_exclu_temporairement: "BA fonctionnel / ERP / gestion d'affaires"
  cas_etude: "projet neutre — jamais un codebase ou un contexte employeur réel"

# -----------------------------------------------------------------------------
# REFERENTIELS
# -----------------------------------------------------------------------------
referentiels:
  google_pm_cert:
    intitule: "Google Project Management: Professional Certificate (Coursera)"
    structure: "7 cours"
    couverts: [C1, C2, C3, C4, C5, C6]
    exclu:
      cours: C7
      intitule: "Accelerez votre recherche d'emploi grâce à l'IA"
      motif: "hors sujet — orientation carriere, pas de production d'artefact PM"
    reserve_fiabilite: >
      Les intitules de compétences repris dans ce fichier suivent la structure
      publique du curriculum. Les libellés exacts, module par module, restent à
      recouper avec les dépôts pedagogiques de référence (rennieramlochan,
      lk-learner) avant usage en entretien.
  scrum_guide:
    version: "2020"
    usage: "socle des agents de la branche agile (C5)"

# -----------------------------------------------------------------------------
# BENCHMARK — BUY VS BUILD (vérifie le 2026-08-31)
# -----------------------------------------------------------------------------
benchmark:
  depots:
    - depot: "sdi2200262/agentic-project-management"
      licence: "MPL-2.0"
      usage_commercial: true
      contrainte_licence: "copyleft de fichier — toute modification d'un fichier source doit rester sous MPL-2.0"
      maturite: "2,4k stars, 479 commits, v1.0.0 — mature"
      agents: [Planner, Manager, Workers]
      artefacts_produits: [Spec, Plan, Rules, "Task Prompts", Memory]
      produit_des_artefacts_pm_cert: false
      ce_qui_est_repris: >
        Modèle d'orchestration Planner/Manager/Workers, gestion de contexte
        persistante (Memory / logs de tâches cumulatifs), et surtout le principe
        de validation humaine obligatoire entre chaque étape.
      verifie: true

    - depot: "kchia/project-management-agentic-workflow"
      licence: "MIT"
      usage_commercial: true
      maturite: "1 star, 4 commits — exercice pedagogique, non éprouvé"
      agents: [DirectPromptAgent, AugmentedPromptAgent, KnowledgeAugmentedPromptAgent,
               RAGKnowledgePromptAgent, EvaluationAgent, RoutingAgent, ActionPlanningAgent]
      artefacts_produits: ["user stories", "feature groups", "engineering tasks"]
      produit_des_artefacts_pm_cert: false
      ce_qui_est_repris: >
        Trois patterns d'architecture, pas de code : routage par similarite
        (RoutingAgent), boucle de rework bornée avec seuil d'itérations
        (EvaluationAgent, max 10), décomposition objectif -> étapes sequentielles
        (ActionPlanningAgent).
      limites_reconnues_par_l_auteur: ["dépendance séquentielle", "communication inter-agents limitee", "critères d'évaluation rigides"]
      verifie: true

  conclusion: >
    Aucun des deux dépôts ne génère d'artefact du Google PM Cert (ni charte, ni
    RACI, ni registre des risques, ni budget, ni plan de communication). La
    réutilisation porte donc sur la couche orchestration et gouvernance
    uniquement. Les dix agents producteurs d'artefacts sont créés en propre :
    c'est la couche de différenciation du projet.

# -----------------------------------------------------------------------------
# CONTEXTE PARTAGE — source unique de vérité consommee par tous les agents
# -----------------------------------------------------------------------------
contexte_partage:
  produit_par: contexte-projet
  format: JSON
  champs:
    - identite: [nom_projet, commanditaire, secteur, description]
    - enjeux: [problème, valeur_attendue, criteres_de_succes]
    - contraintes: [budget_cadre, échéance, réglementaire, technique, ressources]
    - parties_prenantes: [nom, rôle, pouvoir, intérêt, canal_prefere]
    - equipe: [effectif, compétences, localisation, disponibilité]
    - historique: [projets_similaires, lecons_connues]
  regle: >
    Aucun agent producteur n'invente une donnée absente du contexte partage. Une
    donnée manquante est déclarée comme lacune explicite dans l'artefact, jamais
    comblee par plausibilite.

# -----------------------------------------------------------------------------
# Catégories DE VALEUR (correction C4)
# -----------------------------------------------------------------------------
# Origine : la tranche verticale a révèle une contradiction interne. La porte de
# sortie de `risques` exige un déclencheur observable — donc un seuil — alors que
# la règle de cohérence R9 interdit toute valeur non sourcee. Résultat : 6 des 14
# déclencheurs reposaient sur des seuils générés, sans qu'aucune porte ne le voie.
# Trois catégories, et non deux, resolvent la contradiction.
# -----------------------------------------------------------------------------

categories_de_valeur:

  distinction_clef: >
    Un seuil de gestion est une proposition de pilotage ; une donnée factuelle
    générée est un mensonge sur le réel. Les confondre conduit soit à interdire
    les déclencheurs (registre inexploitable), soit à laisser passer des chiffrés
    inventes (registre trompeur).

  categories:

  - categorie: donnee_sourcee
    statut: autorisée
    definition: "valeur traçable vers le contexte partage ou vers un arbitrage humain documente"
    marquage: aucun
    exemple: "60 appels/jour (contexte) ; 400 k€ plafond (arbitrage L2)"

  - categorie: seuil_de_gestion_propose
    statut: autorisee_si_marquee
    definition: >
      Valeur de pilotage proposee par un agent pour rendre un critère observable
      (seuil d'alerte, déclencheur de risque, cadence de contrôle). Ce n'est pas
      une affirmation sur le réel : c'est une proposition qu'un comité arbitre.
    marquage: "[SEUIL PROPOSE — A ARBITRER]"
    exemple: "consommation budgétaire > 70 % au jalon J4"
    regle: >
      Tout seuil propose doit être arbitre par l'humain avant usage en pilotage.
      Non arbitre, il reste une proposition — jamais un engagement.

  - categorie: donnee_factuelle_generee
    statut: Interdite
    definition: >
      Valeur présentée comme un fait sur le réel alors qu'elle est produite par le
      modele : coût unitaire, volumétrie, durée empirique, taux constaté, prix.
    marquage: "sans objet — la valeur ne doit pas être produite"
    conduite_a_tenir: "marquer [A SOURCER] et poursuivre sans la valeur"
    exemple_de_ce_qui_est_interdit: "coût unitaire d'un appel : 12 €"

# =============================================================================
# AGENTS
# =============================================================================
# couche   : orchestration | production | contrôle
# registre : agile | waterfall | hybrid
# source   : réutilise (repris tel quel) | adapte (pattern repris, réécrit) | créé
# =============================================================================

agents:

# --- COUCHE 0 : ORCHESTRATION -----------------------------------------------

  - id: orchestrateur-pm
    nom: "Orchestrateur PM"
    couche: orchestration
    phase: transverse
    registre: hybrid
    source:
      type: adapte
      origine: "sdi2200262/agentic-project-management (Manager) — MPL-2.0"
      justification: >
        Le rôle Manager (assignation, revue, maintien de l'état) est transpose
        au séquençage d'artefacts PM. Réécrit : le dépôt original pilote des
        tâches de développement, pas une chaîne documentaire.
      verifie: true
    competence:
      google_pm_cert: "C1 — rôle et responsabilites du chef de projet ; C6 — intégration de bout en bout"
    role: >
      Point d'entrée unique. Reçoit la demande, déclenche le cadrage du contexte,
      determine la séquence d'agents applicable selon la méthodologie retenue,
      gère les dépendances et les branchements, arbitre les verdicts des portes
      qualité, escalade à l'humain les décisions non delegables.
    entrees:
      - "description brute du projet (utilisateur)"
      - "verdicts des portes qualité (tous agents)"
    sorties:
      - artefact: "plan d'exécution de la chaîne d'agents"
        format: md
      - artefact: "journal de décisions et d'escalades"
        format: md
    depends_on: []
    handoff_vers: [contexte-projet]
    porte_qualite:
      dor: "description de projet non vide ; périmètre identifiable"
      dod: "séquence d'agents établie, dépendances resolues, points de reprise humaine positionnes"
      verdict: [avancer, retravailler, escalader]
      max_rework: 2
    reprise_humaine: "validation de la séquence avant lancement de la chaîne"
    risque_ia: >
      Lancer une chaîne complète sur un contexte trop pauvre et produire un
      portfolio plausible mais creux. Mitigation : porte d'entrée bloquante sur
      la complétude du contexte (voir contexte-projet).

  - id: contexte-projet
    nom: "Cadrage du contexte"
    couche: orchestration
    phase: transverse
    registre: hybrid
    source:
      type: adapte
      origine: "sdi2200262 (Planner + Memory) — MPL-2.0 ; kchia (ActionPlanningAgent) — MIT"
      justification: >
        Principe de decouverte structuree préalable et de memoire partagee
        persistante. Réécrit pour produire un dossier de contexte PM et non une
        spécification technique.
      verifie: true
    competence:
      google_pm_cert: "C2 — définition du projet, livrables et critères de succès"
    role: >
      Interroge et normalise la description d'entrée en un dossier de contexte
      structure. Identifie explicitement les lacunes d'information et les
      qualifie (bloquante / dégradante / mineure). Sert de source unique de
      vérité à tous les agents producteurs.
    entrees:
      - "description brute du projet"
    sorties:
      - artefact: "dossier de contexte projet"
        format: json
      - artefact: "registre des lacunes d'information"
        format: md
    depends_on: [orchestrateur-pm]
    handoff_vers: [methodologue]
    porte_qualite:
      dor: "description de projet fournie"
      dod: >
        Tous les champs du contexte partage sont soit renseignes, soit déclarés
        comme lacune qualifiée. Aucune lacune bloquante non résolue.
      verdict: [avancer, retravailler, escalader]
      max_rework: 3
    reprise_humaine: "comblement des lacunes bloquantes — l'agent ne les invente jamais"
    risque_ia: >
      Combler une lacune par une valeur plausible (budget type, délai standard)
      qui contamine ensuite tout le portfolio. Mitigation : le registre des
      lacunes est un livrable à part entière, pas une note interne.

# --- COUCHE 1 : PRODUCTION — PHASE FONDEMENTS (C1) --------------------------

  - id: methodologue
    nom: "Recommandation de méthodologie"
    couche: production
    phase: fondements
    registre: hybrid
    source:
      type: créé
      justification: "Aucun dépôt du benchmark ne traite le choix de méthodologie."
      verifie: true
    competence:
      google_pm_cert: "C1 — methodologies de gestion de projet (waterfall, agile, lean, six sigma), structures organisationnelles et culture"
    role: >
      Analyse le contexte (stabilite des exigences, tolérance au changement,
      maturité de l'équipe, contraintes réglementaires, cadence de livraison) et
      recommande une méthodologie : waterfall, agile, hybride ou composite.
      Justifie par critères, expose l'alternative écartée et son motif.
      Décision STRUCTURANTE : sa sortie active ou non la branche agile.
    entrees:
      - "dossier de contexte projet (contexte-projet)"
    sorties:
      - artefact: "note de recommandation méthodologique"
        format: md
      - artefact: "drapeau d'activation de la branche agile"
        format: json
    depends_on: [contexte-projet]
    handoff_vers: [charte-objectifs, parties-prenantes]
    porte_qualite:
      dor: "dossier de contexte valide, sans lacune bloquante"
      dod: >
        Recommandation unique et argumentee sur au moins 5 critères explicites ;
        alternative écartée documentee ; drapeau agile positionne.
      verdict: [avancer, retravailler, escalader]
      max_rework: 2
    reprise_humaine: >
      VALIDATION OBLIGATOIRE. Le choix de méthodologie engagé l'organisation et
      la contractualisation. L'IA propose, le chef de projet tranche.
    risque_ia: >
      Biais pro-agile systématique (surrepresente dans les corpus). Mitigation :
      grille de critères imposée, obligation de documenter l'alternative.

# --- COUCHE 1 : PRODUCTION — PHASE INITIATION (C2) --------------------------

  - id: charte-objectifs
    nom: "Charte de projet et objectifs"
    couche: production
    phase: initiation
    registre: waterfall
    source:
      type: créé
      verifie: true
    competence:
      google_pm_cert: "C2 — buts SMART, OKR, périmètre et scope creep, analyse cout-benefice, documentation d'initiation (project charter)"
    role: >
      Produit la charte de projet : justification business, objectifs SMART,
      OKR, périmètre inclus et exclu, livrables, critères de succès mesurables,
      hypothèses et contraintes, analyse cout-benefice de premier niveau.
    entrees:
      - "dossier de contexte projet"
      - "note de recommandation méthodologique"
    sorties:
      - artefact: "charte de projet"
        format: [md, docx]
      - artefact: "objectifs SMART et OKR"
        format: [md, xlsx]
      - artefact: "énoncé de périmètre (scope statement)"
        format: md
    depends_on: [methodologue]
    handoff_vers: [planificateur-wbs, backlog-stories, verificateur-coherence]
    porte_qualite:
      dor: "méthodologie validee par l'humain"
      dod: >
        Chaque objectif satisfait les 5 critères SMART, verifiables un par un ;
        périmètre exclu explicitement renseigne (pas seulement l'inclus) ;
        chaque livrable porte un critère de succès mesurable.
      verdict: [avancer, retravailler, escalader]
      max_rework: 2
    reprise_humaine: "validation du périmètre et de l'analyse cout-benefice — engagement contractuel"
    risque_ia: >
      Objectifs "SMART" en apparence mais dont le M repose sur une metrique
      inventee. Mitigation : toute metrique doit tracer vers le contexte partage
      ou être listee comme lacune.

  - id: parties-prenantes
    nom: "Analyse des parties prenantes et RACI"
    couche: production
    phase: initiation
    registre: waterfall
    source:
      type: créé
      verifie: true
    competence:
      google_pm_cert: "C2 — analyse des parties prenantes, grille pouvoir/intérêt, matrice RACI, rôles et responsabilites"
    role: >
      Cartographie les parties prenantes, les positionne sur une grille
      pouvoir/intérêt, definit la stratégie d'engagement par quadrant, et produit
      la matrice RACI sur les livrables identifiés dans la charte.
    entrees:
      - "dossier de contexte projet"
      - "charte de projet (livrables)"
    sorties:
      - artefact: "registre des parties prenantes"
        format: [md, xlsx]
      - artefact: "grille pouvoir/intérêt"
        format: md
      - artefact: "matrice RACI"
        format: [md, xlsx]
    depends_on: [charte-objectifs]
    handoff_vers: [communications, equipe-cloture, verificateur-coherence]
    porte_qualite:
      dor: "charte validee ; livrables identifiés"
      dod: >
        Un seul A (Accountable) par livrable dans la matrice RACI ; au moins un R
        par livrable ; toute partie prenante du registre apparait dans la matrice
        ou son absence est justifiee.
      verdict: [avancer, retravailler, escalader]
      max_rework: 2
    reprise_humaine: >
      Validation des rapports de force réels et de la stratégie d'engagement.
      La politique interne d'une organisation n'est pas deductible d'un contexte
      ecrit.
    risque_ia: >
      Inventer des parties prenantes generiques (DSI, direction financiere)
      absentes du contexte. Mitigation : chaque entrée du registre trace vers le
      contexte partage ou est marquee "à confirmer".

# --- COUCHE 1 : PRODUCTION — PHASE PLANIFICATION (C3) -----------------------

  - id: planificateur-wbs
    nom: "Planification et découpage"
    couche: production
    phase: planification
    registre: waterfall
    source:
      type: adapte
      origine: "kchia (ActionPlanningAgent) — MIT"
      justification: >
        Pattern de décomposition objectif -> étapes sequentielles repris comme
        principe. Le dépôt ne produit ni WBS ni chemin critique ni jalons : toute
        la substance PM est ecrite en propre.
      verifie: true
    competence:
      google_pm_cert: "C3 — plan de projet, work breakdown structure, estimation de durée, jalons, chemin critique"
    role: >
      Décompose les livrables de la charte en WBS à trois niveaux, estimé les
      durées, identifie les dépendances, positionne les jalons, calcule le chemin
      critique et produit le plan de projet consolide.
    entrees:
      - "charte de projet (livrables, périmètre)"
      - "dossier de contexte (échéance, ressources)"
    sorties:
      - artefact: "work breakdown structure"
        format: [md, xlsx]
      - artefact: "plan de projet (tâches, durées, dépendances)"
        format: [md, xlsx]
      - artefact: "jalons et chemin critique"
        format: md
    depends_on: [charte-objectifs]
    handoff_vers: [risques, budget-achats, qualite-suivi, verificateur-coherence]
    porte_qualite:
      dor: "charte validee ; périmètre figé"
      dod: >
        Chaque livrable de la charte est couvert par au moins un lot de la WBS ;
        tout lot ne tracant vers aucun livrable est déclare en dérogation motivée
        (lot de conduite de projet) ; chemin critique identifie et cohérent avec
        l'échéance du contexte, ou écart signale explicitement.
      coherence_arithmetique:   # correction C3
        obligatoire: true
        controles:
          - "durée du chemin critique == somme des durées de ses lots, recalculée"
          - "sous-total de chaque lot de niveau 1 >= durée de son chemin interne"
          - "marge = fenêtre calendaire réelle - durée du chemin critique, recalculée"
          # --- Ajout 01/09/2026 : generalisation du patron ci-dessus aux ressources.
          # 'duree' est calendaire et se parallelise ; 'charge' (personne-semaines,
          # nouveau champ par lot) ne se parallelise pas au-dela de l'equipe reelle.
          # Un chemin critique qui tient sur le calendrier peut rester intenable si
          # la charge cumulee sature l'equipe : ce sont deux contraintes independantes.
          - "charge cumulée (hypothèse haute) <= etp_interne x durée de la fenêtre, recalculée (R15) — chaque lot déclarant une durée déclare aussi une charge (G6)"
        regle: >
          Tout écart entre un total annoncé et son recalcul est BLOQUANT, quelle
          que soit son ampleur. Origine : un écart de 4 semaines sur le chemin
          critique inversait la conclusion managériale (marge +2 -> -2 semaines).
      verdict: [avancer, retravailler, escalader]
      max_rework: 3
    reprise_humaine: >
      Validation des estimations de durée. Une estimation IA n'a aucune base
      empirique sur l'équipe réelle : elle sert de point de départ d'atelier,
      jamais d'engagement.
    risque_ia: >
      Estimations de durée fabriquees avec une fausse précision (jours ouvres à
      l'unité pres). Mitigation : sortie en fourchettes, avec mention explicite
      du caractere non empirique.

  - id: risques
    nom: "Gestion des risques"
    couche: production
    phase: planification
    registre: hybrid
    source:
      type: créé
      verifie: true
    competence:
      google_pm_cert: "C3 — identification des risques, registre des risques, matrice probabilité/impact, plans d'atténuation"
    role: >
      Identifie les risques par catégorie (temps, budget, périmètre, ressources,
      externe, technique, conformite), les cote en probabilité et impact, produit
      le registre des risques avec proprietaire, stratégie de réponse
      (éviter / réduire / transférer / accepter) et déclencheur de plan de secours.
    entrees:
      - "plan de projet et chemin critique"
      - "dossier de contexte (contraintes)"
      - "registre des lacunes d'information"
    sorties:
      - artefact: "registre des risques"
        format: [md, xlsx]
      - artefact: "matrice probabilité/impact"
        format: md
      - artefact: "plans d'atténuation et déclencheurs"
        format: md
    depends_on: [planificateur-wbs]
    handoff_vers: [budget-achats, qualite-suivi, verificateur-coherence]
    porte_qualite:
      dor: "plan de projet produit ; chemin critique identifie"
      dod: >
        Chaque tâche du chemin critique est couverte par au moins un risque
        analyse ; chaque risque porte une stratégie de réponse et un déclencheur
        observable ; chaque lacune bloquante du registre d'information est
        convertie en risque.
      controles_renforces:
        - controle: "proprietaire POURVU, pas seulement renseigne"   # correction C5
          regle: >
            Le rôle proprietaire doit exister au registre des parties prenantes
            avec un statut pourvu. Un rôle "à nommer" est refuse, sauf dérogation
            motivée tracant le pourvoi comme tâche du plan ou comme risque.
          origine: >
            La porte validait "proprietaire nomme : 14/14" alors que 4 risques
            avaient pour proprietaire un chef de projet non encore nomme.
        - controle: "tout seuil de déclencheur est catégorise"        # correction C4
          regle: >
            Un déclencheur observable exige un seuil, et aucun seuil de gestion
            n'existe dans le contexte d'entrée. Tout seuil produit par l'agent est
            donc marque [SEUIL PROPOSE — A ARBITRER] (catégorie
            seuil_de_gestion_propose). Un seuil non marque est un écart bloquant.
          origine: >
            Contradiction entre la porte de cet agent, qui exige un déclencheur
            observable, et la règle R9, qui interdisait toute valeur non sourcee.
            6 déclencheurs sur 14 reposaient sur des seuils générés non signales.
      verdict: [avancer, retravailler, escalader]
      max_rework: 2
    reprise_humaine: "cotation finale de l'impact — dépend de la tolérance au risque de l'organisation"
    risque_ia: >
      Registre generique applicable à n'importe quel projet. Mitigation : porte
      de sortie exigeant l'ancrage de chaque risque sur un élément nomme du plan
      ou du contexte.

  - id: budget-achats
    nom: "Budget et approvisionnement"
    couche: production
    phase: planification
    registre: waterfall
    source:
      type: créé
      verifie: true
    competence:
      google_pm_cert: "C3 — estimation budgétaire bottom-up, réserve de contingence, coût total de possession, approvisionnement (RFP, fournisseurs, contrats, ethique)"
    role: >
      Construit le budget par estimation ascendante sur la WBS, calcule la réserve
      de contingence à partir du registre des risques, établit le plan de
      decaissement et identifie les besoins d'approvisionnement (appel d'offres,
      critères de sélection fournisseurs, points de vigilance contractuels et
      ethiques).
    entrees:
      - "work breakdown structure"
      - "registre des risques (pour la contingence)"
      - "dossier de contexte (budget cadre)"
    sorties:
      - artefact: "budget détaillé et plan de decaissement"
        format: [md, xlsx]
      - artefact: "plan d'approvisionnement et trame d'appel d'offres"
        format: [md, docx]
    depends_on: [planificateur-wbs, risques]
    handoff_vers: [qualite-suivi, verificateur-coherence]
    porte_qualite:
      dor: "WBS et registre des risques disponibles"
      dod: >
        Chaque poste de coût trace vers un lot de la WBS ; la réserve de
        contingence est justifiee par des risques cotes, pas par un pourcentage
        arbitraire ; l'écart au budget cadre du contexte est chiffré et commente.
      coherence_arithmetique:   # correction C3
        obligatoire: true
        controles:
          - "budget total == somme des postes, recalculée"
          - "sous-total de chaque rubrique == somme de ses lignes, recalculée"
          - "réserve de contingence == somme des expositions des risques retenus"
          - "écart au budget cadre == budget total - budget cadre, recalculé"
      verdict: [avancer, retravailler, escalader]
      max_rework: 2
    reprise_humaine: >
      VALIDATION OBLIGATOIRE. Aucun chiffré budgétaire génère par IA ne doit
      circuler sans vérification humaine — c'est le risque de crédibilité le plus
      élevé du portfolio.
    risque_ia: >
      Coûts unitaires hallucines avec apparence de précision (TJM, licences,
      infrastructure). Mitigation : tout coût unitaire est soit issu du contexte,
      soit marque "[A SOURCER]" — jamais estimé par le modèle.

  - id: communications
    nom: "Plan de communication"
    couche: production
    phase: planification
    registre: hybrid
    source:
      type: créé
      verifie: true
    competence:
      google_pm_cert: "C3 — plan de communication, documentation partagee ; C4 — communication avec les parties prenantes, escalade"
    role: >
      Établit le plan de communication à partir de la grille pouvoir/intérêt :
      qui reçoit quoi, sous quel format, à quelle fréquence, par quel canal, avec
      quel niveau de détail. Definit la chaîne d'escalade et le plan de
      communication de crise.
    entrees:
      - "registre des parties prenantes et grille pouvoir/intérêt"
      - "jalons du plan de projet"
      - "registre des risques (pour la communication de crise)"
    sorties:
      - artefact: "plan de communication"
        format: [md, xlsx]
      - artefact: "chaîne d'escalade"
        format: md
      - artefact: "trames de comptes rendus par audience"
        format: [md, docx]
    depends_on: [parties-prenantes, planificateur-wbs]
    handoff_vers: [qualite-suivi, verificateur-coherence]
    porte_qualite:
      dor: "grille pouvoir/intérêt produite ; jalons positionnes"
      dod: >
        Chaque partie prenante du registre apparait dans au moins une ligne du
        plan ; chaque jalon déclenche au moins une communication ; la chaîne
        d'escalade nomme des rôles, pas des fonctions vagues.
      verdict: [avancer, retravailler]
      max_rework: 2
    reprise_humaine: "validation des canaux et des fréquences — dépend de la culture réelle de l'organisation"
    risque_ia: >
      Plan de communication surdimensionné (rituels que personne ne tiendra).
      Mitigation : porte de sortie exigeant la justification de chaque cadence
      par le quadrant pouvoir/intérêt.

# --- COUCHE 1 : PRODUCTION — PHASE Exécution (C4) ---------------------------

  - id: qualite-suivi
    nom: "Qualité, metriques et suivi"
    couche: production
    phase: exécution
    registre: hybrid
    source:
      type: créé
      verifie: true
    competence:
      google_pm_cert: "C4 — standards de qualité, planification/assurance/contrôle qualité, amélioration continue (DMAIC, PDCA), collecte et analyse de données, metriques et KPI, tableaux de bord, outils de suivi"
    role: >
      Definit les standards de qualité par livrable, le dispositif d'assurance et
      de contrôle qualité, les KPI de pilotage, la structure du tableau de bord et
      la trame de compte rendu d'avancement. Positionne les boucles d'amélioration
      continue.
    entrees:
      - "charte (critères de succès)"
      - "plan de projet et jalons"
      - "budget (pour le suivi de consommation)"
      - "registre des risques (indicateurs d'alerte)"
    sorties:
      - artefact: "plan de management de la qualité"
        format: [md, docx]
      - artefact: "référentiel de KPI et tableau de bord"
        format: [md, xlsx]
      - artefact: "trame de compte rendu d'avancement"
        format: [md, docx]
    depends_on: [planificateur-wbs, budget-achats, communications]
    handoff_vers: [equipe-cloture, verificateur-coherence]
    porte_qualite:
      dor: "plan, budget et plan de communication disponibles"
      dod: >
        Chaque critère de succès de la charte est couvert par au moins un KPI ;
        chaque KPI porte une source de donnée, une fréquence et un seuil d'alerte ;
        aucun KPI sans moyen de mesure identifie.
      verdict: [avancer, retravailler]
      max_rework: 2
    reprise_humaine: "arbitrage des seuils d'alerte et du niveau d'exigence qualité"
    risque_ia: >
      Empilement de KPI non mesurables dans le contexte réel. Mitigation : la
      porte de sortie rejette tout KPI sans source de donnée nommee.

  - id: equipe-cloture
    nom: "Gestion d'équipe et cloture"
    couche: production
    phase: exécution
    registre: hybrid
    source:
      type: créé
      verifie: true
    competence:
      google_pm_cert: "C4 — développement d'équipe, motivation, feedback, influence sans autorité, gestion des conflits, reunions efficaces, cloture (rapport d'impact, rétrospective, leçons apprises, rapport de cloture)"
    role: >
      Produit le dispositif de fonctionnement d'équipe (rituels, règles de
      collaboration, gestion des conflits) et l'ensemble des artefacts de cloture :
      critères de cloture, rapport d'impact, trame de rétrospective, registre des
      leçons apprises, rapport de cloture.
    entrees:
      - "matrice RACI"
      - "dossier de contexte (équipe)"
      - "référentiel de KPI (pour le rapport d'impact)"
      - "charte (critères de succès à évaluer)"
    sorties:
      - artefact: "cadre de fonctionnement d'équipe"
        format: md
      - artefact: "critères et checklist de cloture"
        format: [md, xlsx]
      - artefact: "trames rapport d'impact / rétrospective / leçons apprises"
        format: [md, docx]
    depends_on: [parties-prenantes, qualite-suivi]
    handoff_vers: [verificateur-coherence]
    porte_qualite:
      dor: "RACI et référentiel de KPI disponibles"
      dod: >
        Chaque critère de succès de la charte figure dans la checklist de cloture ;
        le rapport d'impact se structure sur les KPI définis, pas sur des
        catégories generiques.
      verdict: [avancer, retravailler]
      max_rework: 2
    reprise_humaine: >
      Tout ce qui touche à l'évaluation des personnes. L'IA produit des trames de
      fonctionnement, jamais d'appreciation individuelle.
    risque_ia: >
      Conseils de management generiques et interchangeables. Mitigation : ancrage
      obligatoire sur la composition d'équipe du contexte partage.

# --- COUCHE 1 : PRODUCTION — BRANCHE AGILE (C5) -----------------------------
# Conditionnelle : activee uniquement si methodologue positionne le drapeau
# agile (méthodologie agile, hybride ou composite).

  - id: backlog-stories
    nom: "Backlog produit et user stories"
    couche: production
    phase: agile
    registre: agile
    condition_activation: "drapeau_agile == true"
    source:
      type: adapte
      origine: "kchia (équipe Product Manager / Development Engineer) — MIT"
      justification: >
        Le dépôt produit des user stories au format canonique et des tâches avec
        critères d'acceptation, effort et dépendances. Structure de sortie reprise
        et durcie (INVEST, Given/When/Then, DoR) ; le reste est ecrit en propre.
      verifie: true
    competence:
      google_pm_cert: "C5 — backlog produit et affinage, user stories, critères d'acceptation, estimation relative (story points)"
      scrum_guide: "Product Backlog, Product Goal, affinage du backlog, rôle du Product Owner"
    role: >
      Transforme les livrables de la charte en backlog produit ordonné : epics,
      user stories au format INVEST, critères d'acceptation Given/When/Then,
      estimation relative en points, et Définition of Ready.
    entrees:
      - "charte de projet (livrables, objectifs)"
      - "dossier de contexte (utilisateurs, valeur attendue)"
      - "drapeau d'activation agile"
    sorties:
      - artefact: "backlog produit ordonné (epics + user stories)"
        format: [md, xlsx]
      - artefact: "critères d'acceptation Given/When/Then"
        format: md
      - artefact: "Définition of Ready"
        format: md
    depends_on: [charte-objectifs, methodologue]
    handoff_vers: [sprint, verificateur-coherence]
    porte_qualite:
      dor: "charte validee ; drapeau agile actif"
      dod: >
        Chaque story satisfait les 6 critères INVEST, vérifiés un par un ; chaque
        story porte au moins un critère d'acceptation en Given/When/Then ; chaque
        livrable de la charte est couvert par au moins une story ; aucune story
        sans valeur utilisateur explicite.
      verdict: [avancer, retravailler, escalader]
      max_rework: 3
    reprise_humaine: >
      Ordonnancement final du backlog. La priorisation par la valeur est la
      décision propre du Product Owner — c'est la limite la plus nette du système.
    risque_ia: >
      Stories techniques deguisees en stories utilisateur ("en tant
      qu'utilisateur, je veux une API..."). Mitigation : porte de sortie testant
      la presence d'un bénéficiaire réel et d'un bénéfice observable.

  - id: sprint
    nom: "Cadence de sprint"
    couche: production
    phase: agile
    registre: agile
    condition_activation: "drapeau_agile == true"
    source:
      type: créé
      justification: "Aucun dépôt du benchmark ne produit d'artefacts de sprint Scrum."
      verifie: true
    competence:
      google_pm_cert: "C5 — planification de sprint, backlog de sprint, définition of done, burndown, rétrospective, événements Scrum"
      scrum_guide: "Sprint, Sprint Planning, Sprint Backlog, Définition of Done, Daily Scrum, Sprint Review, Sprint Rétrospective"
    role: >
      Établit la cadence : durée de sprint justifiee, capacité d'équipe,
      composition du premier sprint backlog avec objectif de sprint, Définition of
      Done, dispositif de suivi (burndown) et trames des cinq événements Scrum.
    entrees:
      - "backlog produit ordonné"
      - "dossier de contexte (équipe, disponibilité)"
      - "Définition of Ready"
    sorties:
      - artefact: "cadence et capacité d'équipe"
        format: md
      - artefact: "sprint backlog initial et objectif de sprint"
        format: [md, xlsx]
      - artefact: "Définition of Done"
        format: md
      - artefact: "trames des événements Scrum et burndown"
        format: [md, xlsx]
    depends_on: [backlog-stories]
    handoff_vers: [qualite-suivi, verificateur-coherence]
    porte_qualite:
      dor: "backlog produit ordonné ; DoR établie ; capacité d'équipe connue ou déclarée en lacune"
      dod: >
        Toute story du sprint backlog satisfait la DoR ; la charge engagée ne
        dépasse pas la capacité calculee ; l'objectif de sprint est unique et
        formule en termes de valeur, pas de liste de tâches ; la DoD est
        verifiable sans jugement subjectif.
      coherence_arithmetique:   # correction C3
        obligatoire: true
        controles:
          - "charge engagée == somme des points des stories du sprint backlog, recalculée"
          - "capacité == effectif disponible x durée de sprint, recalculée"
          - "charge engagée <= capacité, vérifie sur les valeurs recalculees"
      verdict: [avancer, retravailler, escalader]
      max_rework: 2
    reprise_humaine: >
      Engagement de sprint. Une équipe s'engagé elle-meme sur un sprint — c'est le
      Scrum Guide, pas une préférence. L'IA propose une composition, l'équipe
      decide.
    risque_ia: >
      Velocite inventee sans historique. Mitigation : en l'absence de donnée
      historique dans le contexte, la capacité est déclarée comme hypothèse à
      calibrer sur les premiers sprints, jamais présentée comme un calcul.

# --- COUCHE 2 : Contrôle TRANSVERSE -----------------------------------------

  - id: verificateur-coherence
    nom: "Vérification de cohérence inter-artefacts"
    couche: contrôle
    phase: transverse
    registre: hybrid
    source:
      type: adapte
      origine: "kchia (EvaluationAgent, boucle de rework bornée) — MIT"
      justification: >
        Pattern de boucle d'évaluation itérative avec plafond d'itérations repris.
        Les règles de cohérence PM sont ecrites en propre — le dépôt original
        évalue la conformite à un prompt, pas la cohérence d'un portfolio.
      verifie: true
    competence:
      google_pm_cert: "C6 — intégration et cohérence d'ensemble du portfolio ; C3 — cohérence du plan de projet"
    role: >
      Contrôle la cohérence croisee du portfolio, independamment des agents
      producteurs. Ne réécrit pas les artefacts : emet un verdict et renvoie à
      l'agent auteur.
    # --- Correction C2 : chaque règle porte sa condition d'applicabilité.
    # Sans elle, une règle non évaluable faute d'agent hors périmètre produisait
    # le même résultat qu'une règle en échec faute d'artefact manquant.
    etats_de_sortie: [conforme, écart, non_applicable, derogation_accordee]
    regle_des_etats: >
      `non_applicable` doit toujours être justifie par une condition_applicabilite
      non satisfaite, JAMAIS par une absence constatée d'artefact. Un artefact
      attendu et manquant est un `ecart`, pas une non-applicabilite.

    regles_de_coherence:
      - id: R1
        regle: "périmètre de la charte == somme des lots de la WBS"
        condition_applicabilite: [charte-objectifs, planificateur-wbs]
        derogation_admise: true
        motif_de_derogation_recevable: >
          Lot de conduite de projet (cadrage, appel d'offres, contractualisation,
          support post-mise en service) ne tracant vers aucun livrable. L'agent le
          déclare comme tel ; le vérificateur l'enregistre au lieu de le rejeter.

      - id: R2
        regle: "somme des postes budgétaires == budget total annoncé"
        condition_applicabilite: [budget-achats]
        derogation_admise: false

      - id: R3
        regle: "réserve de contingence justifiee par des risques cotes"
        condition_applicabilite: [budget-achats, risques]
        derogation_admise: false

      - id: R4
        regle: "toute partie prenante du registre présente dans le RACI et le plan de communication"
        condition_applicabilite: [parties-prenantes, communications]
        derogation_admise: true
        motif_de_derogation_recevable: >
          Partie prenante non responsable d'un livrable (destinataire final,
          source de donnée, fonction de suivi), rattachee explicitement à une
          partie prenante présente dans la matrice.

      - id: R5
        regle: "un seul Accountable par livrable dans le RACI"
        condition_applicabilite: [parties-prenantes]
        derogation_admise: false

      - id: R6
        regle: "chaque critère de succès de la charte couvert par un KPI et present en checklist de cloture"
        condition_applicabilite: [charte-objectifs, qualite-suivi, equipe-cloture]
        derogation_admise: false

      - id: R7
        regle: "chaque tâche du chemin critique couverte par un risque analyse"
        condition_applicabilite: [planificateur-wbs, risques]
        derogation_admise: false

      - id: R8
        regle: "chaque livrable de la charte couvert par au moins une story"
        condition_applicabilite: [charte-objectifs, backlog-stories]
        condition_supplementaire: "drapeau_agile == true"
        derogation_admise: false
        note: >
          Si drapeau_agile == false, la règle est `non_applicable` par condition.
          Si drapeau_agile == true et que backlog-stories n'a rien rendu, c'est un
          `ecart` bloquant — pas une non-applicabilite.

      - id: R9
        regle: >
          Toute valeur chiffrée appartient à l'une des trois categories_de_valeur.
          Une donnée factuelle générée est un écart bloquant. Un seuil de gestion
          non marque [SEUIL PROPOSE — A ARBITRER] est un écart bloquant.
        condition_applicabilite: "tous les agents producteurs"
        derogation_admise: false
        origine: "correction C4 — remplace l'ancienne règle binaire source / non source"

      # --- Correction C5 : nouvelle règle croisee.
      # Origine : la porte de `risques` avait valide "proprietaire nomme : 14/14"
      # alors que 4 proprietaires etaient "le chef de projet", rôle que la charte
      # declarait à nommer. La porte verifiait une chaîne de caracteres.
      - id: R10
        regle: >
          Tout rôle cité comme proprietaire, responsable ou approbateur dans un
          artefact est POURVU au registre des parties prenantes (statut != "à nommer",
          "à confirmer", "à constituer", "à contractualiser").
        condition_applicabilite: [parties-prenantes]
        portee: [risques, parties-prenantes, charte-objectifs, qualite-suivi, equipe-cloture]
        derogation_admise: true
        motif_de_derogation_recevable: >
          Rôle non encore pourvu mais dont le pourvoi est lui-meme trace comme
          tâche du plan ou comme risque. La dérogation rend le trou visible au
          lieu de le masquer derriere un libellé.

      # --- Correction C3 : cohérence arithmetique, appliquee en second niveau.
      # Origine : le chemin critique annoncé 50-67 semaines valait en réalité
      # 52-71. La conclusion managériale en etait inversée (marge +2 -> -2 sem.).
      - id: R11
        regle: >
          Tout total, sous-total ou cumul annoncé dans un artefact est recalculé à
          partir de ses composants. Tout écart est un écart bloquant, quelle que
          soit son ampleur.
        condition_applicabilite: [planificateur-wbs]
        portee: [planificateur-wbs, budget-achats, sprint]
        derogation_admise: false
        note: >
          Règle mecanique, donc fiable. C'est la seule catégorie d'erreur que la
          relecture ne détecte pas et que le recalcul détecte toujours.

      # --- Ajout 01/09/2026 : les 7 portes de sortie declarees dans un prompt sans
      # controle code (voir docs/ecarts-spec-implementation.md) sont implementees.
      # Cinq lisent un seul artefact (gates/, hors de cette liste, qui ne recense
      # que les regles croisant plusieurs artefacts) ; deux croisent contexte et
      # risques, donc figurent ici.
      - id: R12
        regle: "chaque lacune convertie_en_risque existe dans le registre des risques sous l'identifiant annoncé"
        condition_applicabilite: [contexte-projet, risques]
        derogation_admise: true

      - id: R13
        regle: "chaque hypothèse de la charte portant un risque_associe est couverte par le registre des risques"
        condition_applicabilite: [charte-objectifs, risques]
        derogation_admise: true

      # --- Ajout 01/09/2026 : generalisation du patron R11 (recalcul aval +
      # confrontation a une contrainte amont fixee independamment) au-dela du
      # seul calendrier. Origine : R11 ne couvrait que le chemin critique ;
      # rien ne confrontait le budget ou la charge d'equipe a leurs contraintes
      # amont du contexte.
      - id: R14
        regle: "budget total recalculé depuis les postes <= budget cadre du contexte, recalculé"
        condition_applicabilite: [budget-achats, contexte-projet]
        derogation_admise: false
        note: >
          Complete budget-achats.porte_qualite.coherence_arithmetique ("écart au
          budget cadre"), specifie depuis la v1.1 mais jamais code : R2 recalculait
          le total, sans jamais le confronter au plafond amont.

      - id: R15
        regle: "charge cumulée (hypothèse haute) <= etp_interne x durée de la fenêtre du contexte, recalculée"
        condition_applicabilite: [planificateur-wbs, contexte-projet]
        derogation_admise: false
        note: >
          Sans équivalent en v1.1 : le champ 'charge' par lot (personne-semaines,
          distinct de 'duree' qui est calendaire) est une extension de schema
          ajoutee dans cette session pour rendre cette confrontation possible.

    # --- Correction C6 : mecanisme de dérogation motivée.
    # Origine : 2 écarts sur 6 de la tranche verticale etaient des faux positifs,
    # les artefacts etant méthodologiquement corrects et les règles trop strictes.
    # Sans traitement, les faux positifs decredibilisent le contrôle et poussent à
    # desactiver la règle.
    derogations:
      principe: >
        Un agent producteur peut déclarer une exception explicite et motivée à une
        règle admettant la dérogation. Le vérificateur l'ENREGISTRE au lieu de la
        rejeter, et la fait figurer au rapport de cohérence.
      forme_attendue:
        regle_visee: "id de la règle"
        element_concerne: "lot, partie prenante, valeur"
        motif: "justification méthodologique explicite"
      regles_de_gouvernance:
        - "une dérogation est visible et contestable, jamais silencieuse"
        - "une dérogation sur une règle a derogation_admise: false est refusée et devient un écart"
        - "le rapport de cohérence liste les dérogations accordees dans une section dédiée"
        - "un taux de dérogation élevé sur une règle signale une règle mal ecrite, pas des artefacts mauvais"
    entrees:
      - "tous les artefacts produits"
    sorties:
      - artefact: "rapport de cohérence (écarts, gravite, agent responsable)"
        format: md
    depends_on: [charte-objectifs, parties-prenantes, planificateur-wbs, risques,
                 budget-achats, communications, qualite-suivi, equipe-cloture,
                 backlog-stories, sprint]
    handoff_vers: [auditeur-curriculum, orchestrateur-pm]
    porte_qualite:
      dor: "tous les agents producteurs applicables ont rendu leur verdict avancer"
      dod: "aucun écart de gravite bloquante non résolu ; écarts mineurs documentes"
      verdict: [avancer, retravailler, escalader]
      max_rework: 3
    reprise_humaine: "arbitrage des écarts que deux agents refusent de résoudre après épuisement des boucles"
    risque_ia: >
      Complaisance : valider un portfolio cohérent en apparence mais faux au fond.
      Mitigation : règles de cohérence explicites et mecaniques, pas d'appreciation
      globale.

  - id: auditeur-curriculum
    nom: "Audit de conformite au référentiel"
    couche: contrôle
    phase: transverse
    registre: hybrid
    source:
      type: créé
      justification: >
        Aucun dépôt du benchmark ne fait d'audit de traçabilité vis-à-vis d'un
        référentiel de compétences. C'est la brique la plus differenciante du
        systeme.
      verifie: true
    competence:
      google_pm_cert: "C6 — Capstone : application intégrée ; transverse C1-C5"
    role: >
      Vérifie que le portfolio couvre effectivement les compétences du curriculum
      C1-C6, que chaque artefact est traçable à une compétence nommee, et produit
      la matrice de traçabilité compétence -> agent -> artefact. Signale les
      compétences non couvertes.
    entrees:
      - "tous les artefacts produits"
      - "rapport de cohérence"
    sorties:
      - artefact: "matrice de traçabilité compétence / agent / artefact"
        format: [md, xlsx]
      - artefact: "rapport de couverture (compétences non couvertes, motifs)"
        format: md
    depends_on: [verificateur-coherence]
    handoff_vers: [orchestrateur-pm]
    porte_qualite:
      dor: "rapport de cohérence sans écart bloquant"
      dod: >
        Chaque cours C1-C6 dispose d'au moins un artefact traçable ; toute
        compétence non couverte est listee avec son motif (hors périmètre,
        non applicable à la méthodologie retenue, lacune de contexte).
      verdict: [avancer, retravailler]
      max_rework: 2
    reprise_humaine: "validation finale du portfolio avant présentation"
    risque_ia: >
      Auto-attribution de couverture ("cet artefact couvre la compétence X") sans
      vérification du contenu réel. Mitigation : la matrice cite l'élément précis
      de l'artefact, pas seulement son titre.

# =============================================================================
# FLUX D'ORCHESTRATION
# =============================================================================

flux:
  # --- Correction C1 : définition d'une tranche d'exécution.
  # Origine : la tranche verticale de test avait été définie par un CHOIX de
  # 6 agents. `risques` s'est révèle non démarrable, sa porte d'entrée exigeant un
  # chemin critique produit par `planificateur-wbs`, absent du choix.
  regle_de_tranche: >
    Toute exécution partielle de la chaîne se definit comme la Fermeture
    TRANSITIVE des dépendances des agents vises, jamais comme une sélection
    d'agents. Sélectionner un agent, c'est sélectionner tout son arbre amont.
  controle: >
    Avant lancement, l'orchestrateur vérifie que pour chaque agent retenu, tous
    les agents de son `depends_on` sont presents dans la tranche. Sinon la tranche
    est rejetee avec la liste des agents manquants.

  principe: >
    Chaîne séquentielle a branchement conditionnel, avec double contrôle final.
    Chaque hand-off passe une porte qualité ; un verdict "retravailler" renvoie à
    l'agent auteur dans la limite de max_rework, après quoi le cas est escalade à
    l'humain.

  sequence:
    - etape: 0
      agents: [orchestrateur-pm, contexte-projet]
      sortie: "dossier de contexte + registre des lacunes"
      point_de_reprise_humaine: "comblement des lacunes bloquantes"

    - etape: 1
      agents: [methodologue]
      sortie: "recommandation méthodologique + drapeau agile"
      point_de_reprise_humaine: "VALIDATION OBLIGATOIRE — décision engageante"

    - etape: 2
      agents: [charte-objectifs]
      puis: [parties-prenantes]
      note: "séquentiel : le RACI à besoin des livrables de la charte"
      point_de_reprise_humaine: "validation du périmètre et de l'analyse cout-benefice"

    - etape: 3
      agents: [planificateur-wbs]
      puis_parallele: [risques, communications]
      puis: [budget-achats]
      note: >
        budget-achats dépend de risques (contingence) ET de planificateur-wbs
        (estimation ascendante) — il ne peut pas être parallelise avec eux.
      point_de_reprise_humaine: "VALIDATION OBLIGATOIRE du budget et des estimations de durée"

    - etape: 4
      agents: [qualite-suivi]
      puis: [equipe-cloture]

    - etape: 5
      condition: "drapeau_agile == true"
      agents: [backlog-stories]
      puis: [sprint]
      note: "branche ignoree si méthodologie waterfall pure"
      point_de_reprise_humaine: "ordonnancement du backlog et engagement de sprint"

    - etape: 6
      agents: [verificateur-coherence]
      puis: [auditeur-curriculum]
      note: "séquentiel : on ne vérifie la conformite référentiel qu'après cohérence interne"
      point_de_reprise_humaine: "validation finale du portfolio"

  branchements:
    waterfall_pur: "étapes 0,1,2,3,4,6 — branche agile ignoree"
    agile_pur: "étapes 0,1,2,3(allégé),5,6 — WBS et chemin critique produits en version réduite"
    hybride: "toutes les étapes"

  boucle_de_rework:
    origine: "kchia/EvaluationAgent (plafond d'itérations) — pattern MIT"
    regle: >
      Un verdict "retravailler" retourne à l'agent auteur avec les écarts
      constates. Au-dela de max_rework, verdict "escalader" : l'orchestrateur
      remonté à l'humain plutôt que de boucler.

# =============================================================================
# REPRISE HUMAINE — ce que le système ne décide jamais
# =============================================================================

reprise_humaine:
  principe: >
    Repris de sdi2200262 (validation utilisateur obligatoire entre chaque étape)
    et durci : certaines décisions ne sont pas seulement validees par l'humain,
    elles lui appartiennent.

  jamais_delegue:
    - decision: "choix de méthodologie"
      motif: "engagé l'organisation, la contractualisation et le mode de collaboration"
    - decision: "arbitrage de valeur et ordonnancement du backlog"
      motif: "prérogative du Product Owner (Scrum Guide) — la valeur n'est pas calculable"
    - decision: "validation des chiffrés budgétaires"
      motif: "risque de crédibilité le plus élevé ; aucun coût unitaire génère n'est fiable"
    - decision: "engagement de sprint"
      motif: "une équipe s'engagé elle-meme (Scrum Guide)"
    - decision: "engagement vis-à-vis des parties prenantes"
      motif: "la parole donnée engagé une personne, pas un système"
    - decision: "évaluation des personnes"
      motif: "hors périmètre de l'IA, quelle que soit la qualité des données"
    - decision: "cotation finale de l'impact des risques"
      motif: "dépend de la tolérance au risque de l'organisation, non deductible"

  ou_l_ia_apporte_le_plus:
    - "exhaustivité structurelle (aucune rubrique oubliee)"
    - "cohérence croisee entre artefacts, verifiable mecaniquement"
    - "traçabilité au référentiel"
    - "première version d'un artefact, comme support d'atelier"

  ou_l_ia_est_risquee:
    - "toute valeur chiffrée non présenté dans le contexte d'entrée"
    - "estimation de durée et de velocite sans historique"
    - "cartographie politique d'une organisation"
    - "appreciation qualitative deguisee en calcul"

# =============================================================================
# MATRICE DE Traçabilité — compétence Google PM Cert -> agent -> artefact
# =============================================================================

matrice_tracabilite:

  C1_fondements:
    intitule: "Fondements de la gestion de projet"
    competences:
      - competence: "methodologies (waterfall, agile, lean, six sigma)"
        agent: methodologue
        artefact: "note de recommandation méthodologique"
      - competence: "rôle et responsabilites du chef de projet"
        agent: orchestrateur-pm
        artefact: "plan d'exécution et journal de décisions"

  C2_initiation:
    intitule: "Lancement de projet : démarrer un projet réussi"
    competences:
      - competence: "documentation d'initiation (project charter)"
        agent: charte-objectifs
        artefact: "charte de projet"
      - competence: "buts SMART et OKR"
        agent: charte-objectifs
        artefact: "objectifs SMART et OKR"
      - competence: "périmètre et scope creep"
        agent: charte-objectifs
        artefact: "énoncé de périmètre"
      - competence: "analyse des parties prenantes, grille pouvoir/intérêt"
        agent: parties-prenantes
        artefact: "registre des parties prenantes + grille pouvoir/intérêt"
      - competence: "matrice RACI"
        agent: parties-prenantes
        artefact: "matrice RACI"

  C3_planification:
    intitule: "Planification de projet : la mise en place du projet"
    competences:
      - competence: "work breakdown structure, estimation, jalons, chemin critique"
        agent: planificateur-wbs
        artefact: "WBS + plan de projet + jalons et chemin critique"
      - competence: "gestion des risques, registre, matrice probabilité/impact"
        agent: risques
        artefact: "registre des risques + matrice + plans d'atténuation"
      - competence: "budget, estimation ascendante, réserve de contingence"
        agent: budget-achats
        artefact: "budget détaillé et plan de decaissement"
      - competence: "approvisionnement (RFP, fournisseurs, contrats, ethique)"
        agent: budget-achats
        artefact: "plan d'approvisionnement et trame d'appel d'offres"
      - competence: "plan de communication et documentation partagee"
        agent: communications
        artefact: "plan de communication + chaîne d'escalade"

  C4_execution:
    intitule: "Exécution du projet"
    competences:
      - competence: "management de la qualité, amélioration continue"
        agent: qualite-suivi
        artefact: "plan de management de la qualité"
      - competence: "données, metriques, KPI, tableaux de bord"
        agent: qualite-suivi
        artefact: "référentiel de KPI et tableau de bord"
      - competence: "communication d'avancement et escalade"
        agent: qualite-suivi
        artefact: "trame de compte rendu d'avancement"
      - competence: "développement d'équipe, motivation, gestion des conflits"
        agent: equipe-cloture
        artefact: "cadre de fonctionnement d'équipe"
      - competence: "cloture : rapport d'impact, rétrospective, leçons apprises"
        agent: equipe-cloture
        artefact: "critères de cloture + trames rapport d'impact / rétrospective"

  C5_agile:
    intitule: "Gestion de projet agile"
    condition: "drapeau_agile == true"
    competences:
      - competence: "backlog produit, affinage, user stories, critères d'acceptation"
        agent: backlog-stories
        artefact: "backlog produit ordonné + critères Given/When/Then + DoR"
      - competence: "estimation relative (story points)"
        agent: backlog-stories
        artefact: "backlog produit ordonné (colonne estimation)"
      - competence: "sprint planning, sprint backlog, définition of done, burndown"
        agent: sprint
        artefact: "sprint backlog initial + DoD + trames événements Scrum"

  C6_capstone:
    intitule: "Capstone : application de la gestion de projet dans le monde réel"
    competences:
      - competence: "intégration et cohérence d'ensemble"
        agent: verificateur-coherence
        artefact: "rapport de cohérence"
      - competence: "application intégrée du référentiel"
        agent: auditeur-curriculum
        artefact: "matrice de traçabilité + rapport de couverture"

  C7:
    statut: "EXCLU — hors sujet (orientation carriere, aucune production d'artefact PM)"

# =============================================================================
# Synthèse
# =============================================================================

synthese:
  nombre_d_agents: 15
  repartition:
    orchestration: 2
    production: 11
    controle: 2
  repartition_par_source:
    adapte: 5     # orchestrateur-pm, contexte-projet, planificateur-wbs, backlog-stories, verificateur-coherence
    cree: 10
    reutilise: 0
  commentaire_source: >
    Aucun agent n'est réutilise tel quel : les deux dépôts du benchmark ne
    produisent aucun artefact du référentiel PM. Ce qui est repris, ce sont des
    patterns d'architecture (orchestration, memoire partagee, boucle de rework
    bornée, décomposition) — pas de la substance metier. La couche de generation
    d'artefacts alignee curriculum est integralement construite en propre.

  ce_que_la_conception_demontre:
    - "séparation des responsabilites et gouvernance par portes qualité explicites"
    - "DoR/DoD transposees en contrats de décision exécutables"
    - "raisonnement buy-vs-build avec due diligence licence et maturité vérifiée"
    - "double registre assumé : waterfall et agile dans une même chaîne, avec branchement conditionnel"
    - "honnêteté méthodologique : ce que l'IA ne décide pas est documente au même niveau que ce qu'elle produit"

  validation:
    methode: "tranche verticale — 7 agents sur 15 exécutés manuellement sur un cas neutre"
    dossier: "portfolio-demo/"
    cas_etude: "refonte d'un portail client B2B (fictif, secteur generique)"
    agents_couverts: [contexte-projet, methodologue, charte-objectifs, parties-prenantes,
                      planificateur-wbs, risques, verificateur-coherence]
    resultat: >
      6 défauts de conception identifiés, dont 5 introuvables en relisant la
      cartographie. Corrections C1 à C6 portees dans la version 1.1.
    defaut_le_plus_significatif: >
      Un agent a valide sa propre porte de sortie avec un chemin critique mal
      additionne (67 semaines annoncées, 71 réelles), ce qui inversait la
      conclusion managériale sur la tenue de l'échéance (marge +2 -> -2 semaines).
      Aucune porte individuelle ne pouvait le voir : une porte vérifie qu'un
      chemin critique EXISTE, pas qu'il est correctement additionne.
    enseignement_central: >
      Une porte de sortie vérifie un format, pas une vérité. Le second niveau de
      contrôle ne sert pas à relire, il sert à Recalculer. C'est ce qui justifie
      l'architecture à deux niveaux, par un argument plus fort que prévu.

  limites_assumees:
    - "chaîne jamais exécutée automatiquement : la tranche verticale a été jouee manuellement selon les spécifications"
    - "8 agents sur 15 restent non testes (budget-achats, communications, qualite-suivi, equipe-cloture, backlog-stories, sprint, auditeur-curriculum, orchestrateur-pm)"
    - "libellés exacts des compétences du curriculum à recouper avec les dépôts pedagogiques"
    - "les portes qualité sont specifiees, leur implémentation reste à ecrire (livrable 2)"
    - "les corrections C1 à C6 sont specifiees mais n'ont pas été re-testees par une nouvelle tranche"
